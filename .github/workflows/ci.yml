name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manager-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: manager/requirements.txt
      - run: pip install pytest httpx -r manager/requirements.txt
      - run: python -m compileall -q manager runtime
      - run: pytest -q tests/test_security.py tests/test_db.py tests/test_static_contract.py tests/test_manager_app.py

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose file
        run: docker compose config >/dev/null
      - name: Build both containers
        run: docker compose build

  runtime-pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: runtime/requirements.txt
      - run: pip install pytest -r runtime/requirements.txt
      - run: pytest -q tests/test_runtime_integration.py

  runtime-latest-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install latest compatible runtime stack
        run: |
          pip install pytest 'Django>=4.2,<5' 'django-revproxy>=0.13' gunicorn
      - name: Compatibility smoke test with latest django-revproxy
        run: pytest -q tests/test_runtime_integration.py
